<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坦克大战</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="hud-top">
        <h1>坦克大战</h1>
        <div class="mode-switch" aria-label="选择游戏模式">
          <button id="desktopModeBtn" class="mode-btn" type="button">电脑版</button>
          <button id="mobileModeBtn" class="mode-btn" type="button">手机版</button>
        </div>
      </div>
      <div class="stats">
        <span>分数: <strong id="score">0</strong></span>
        <span>生命: <strong id="lives">3</strong></span>
        <span>敌人: <strong id="enemies">0</strong></span>
        <span>子弹: <strong id="bulletCount">1</strong>x</span>
        <span>关卡: <strong id="level">1 (0/30)</strong></span>
      </div>
      <p class="tips">操作: WASD/方向键移动，空格射击，R重新开始</p>
    </header>
    <section class="game-wrap">
      <div class="mobile-topbar">
        <div id="mobileStatus" class="mobile-status">分数 0 | 命 3 | 关 1 | 弹 1x</div>
        <button id="rulesBtn" class="rules-btn" type="button">规则</button>
      </div>
      <canvas id="game" width="900" height="600" aria-label="坦克大战游戏画布"></canvas>
      <div id="controls" class="controls">
        <div id="joystick" class="joystick" aria-label="移动摇杆">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <div class="dpad">
          <button class="ctrl-btn" data-key="ArrowUp">↑</button>
          <div class="dpad-mid">
            <button class="ctrl-btn" data-key="ArrowLeft">←</button>
            <button class="ctrl-btn" data-key="ArrowDown">↓</button>
            <button class="ctrl-btn" data-key="ArrowRight">→</button>
          </div>
        </div>
        <button class="ctrl-btn fire-btn" data-key=" ">🔥</button>
      </div>
      <div id="rulesPanel" class="rules-panel hidden" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
        <div class="rules-card">
          <h2 id="rulesTitle">游戏规则</h2>
          <p>移动：使用左侧方向键控制坦克。</p>
          <p>发射：点击右侧红色按钮。</p>
          <p>目标：保护基地，消灭每一关的敌人。</p>
          <p>道具：拾取修复、连发、护盾可以增强生存能力。</p>
          <button id="resumeBtn" type="button">继续游戏</button>
        </div>
      </div>
      <div id="rotateHint" class="rotate-hint hidden">
        <p>请横屏游玩，游戏画面会更大</p>
        <p class="wechat-tip">微信内置浏览器通常不能强制横屏，请点右上角菜单，选择在系统浏览器中打开，或手动开启手机横屏。</p>
        <button id="retryFullscreenBtn" type="button">全屏横屏</button>
      </div>
      <div id="overlay" class="overlay hidden">
        <h2 id="overlayTitle">游戏结束</h2>
        <p id="overlayText"></p>
        <button id="restartBtn">重新开始</button>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
